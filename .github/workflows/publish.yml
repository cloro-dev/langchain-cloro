# Publishes the package to PyPI when a merge to main changes `version` in
# pyproject.toml, then creates the vX.Y.Z tag and GitHub Release. A version
# tag (v0.3.1, v1.0.0) pushed by hand also publishes, as before.
#
# PyPI Trusted Publishing gives the job a short-lived OIDC token. No API
# token is stored. The Trusted Publisher on
# https://pypi.org/manage/project/langchain-cloro/settings/publishing/ is:
#   owner: cloro-dev, repository: langchain-cloro, workflow: publish.yml
#
# A pushed tag must agree with `version` in pyproject.toml.

name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish to PyPI
    needs: check
    if: always() && (startsWith(github.ref, 'refs/tags/') || needs.check.outputs.new == 'true')
    runs-on: ubuntu-latest
    permissions:
      # Required to get the OIDC token for Trusted Publishing.
      id-token: write
      # Required to create the release.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Check that the tag agrees with the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv version --short)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not agree with version $version in pyproject.toml"
            exit 1
          fi

      - name: Run unit tests
        run: uv run --group test pytest tests/unit_tests

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

      - name: Create the GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.check.outputs.version }}" --target "$GITHUB_SHA" --title "v${{ needs.check.outputs.version }}" --generate-notes
